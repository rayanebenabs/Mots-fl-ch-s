name: Déploiement GitHub Pages

on:
  push:
    branches: [claude/mobile-crossword-game-91oy4o]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# une seule mise en ligne à la fois, sans annuler celle déjà en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # enablement crée le site Pages au premier passage, rien à cliquer
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
